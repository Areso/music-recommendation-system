<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Find Similar Artists</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .back { font-size: 13px; }
        .search-box { position: relative; width: 100%; }
        input[type="text"] { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
        .suggestions {
            position: absolute; border: 1px solid #ccc; background: #fff;
            width: 100%; max-height: 200px; overflow-y: auto; z-index: 1000;
        }
        .suggestion-item { padding: 8px 12px; cursor: pointer; }
        .suggestion-item:hover { background-color: #f0f0f0; }
        .results { margin-top: 20px; }
        .result-card { border-bottom: 1px solid #eee; padding: 8px 0; }
        .artist-link { color: #0066cc; text-decoration: underline; cursor: pointer; }
        .artist-link:hover { color: #004499; }
        .tag-list { font-size: 13px; color: #555; margin-top: 4px; font-style: italic; }
        .warning {
            border: 1px solid #e0c000; background: #fffbe6; padding: 10px 12px;
            font-size: 13px; margin-top: 16px;
        }
        .seed { color: #666; font-size: 13px; }
    </style>
</head>
<body>

    <p class="back"><a href="index.html">&larr; Back to menu</a></p>

    <h2>Find Similar Artists</h2>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Type an artist name (e.g. Metallica, ABC)..." autocomplete="off">
        <div id="suggestions" class="suggestions"></div>
    </div>

    <div class="results" id="results"></div>

    <script>
        const API_URL        = 'http://127.0.0.1:8000/api';
        const searchInput    = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestions');
        const resultsBox     = document.getElementById('results');

        let debounceTimer;

        // 1. AJAX Autocomplete Event Listener
        searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            const query = searchInput.value.trim();

            if (query.length === 0) {
                suggestionsBox.innerHTML = '';
                return;
            }

            // Debounce network requests by 200ms
            debounceTimer = setTimeout(async () => {
                const res  = await fetch(`${API_URL}/autocomplete_artist?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                renderSuggestions(data.suggestions);
            }, 200);
        });

        // 2. Render Autocomplete Dropdown
        function renderSuggestions(suggestions) {
            suggestionsBox.innerHTML = '';
            suggestions.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.textContent = item.artist_name;
                div.onclick = () => {
                    searchInput.value = item.artist_name;
                    suggestionsBox.innerHTML = '';
                    runSearch(item.artist_id);
                };
                suggestionsBox.appendChild(div);
            });
        }

        // Fetch and display tags for a specific artist
        async function loadArtistTags(artistId, containerId) {
            const tagContainer = document.getElementById(containerId);
            if (tagContainer.innerHTML) {
                tagContainer.innerHTML = ''; // Toggle off if already open
                return;
            }

            tagContainer.innerHTML = 'Loading tags...';
            const res  = await fetch(`${API_URL}/fetch_tags_of_the_artist?q=${artistId}`);
            const data = await res.json();

            if (data.results.length === 0) {
                tagContainer.innerHTML = 'No tags found.';
                return;
            }

            tagContainer.innerHTML = `<strong>Tags:</strong> ${data.results.join(', ')}`;
        }

        // Use one of the results as the new seed artist
        function pivotTo(artistId, artistName) {
            searchInput.value = artistName;
            window.scrollTo(0, 0);
            runSearch(artistId);
        }

        // 3. AJAX Search Call
        async function runSearch(artistId) {
            resultsBox.innerHTML = 'Searching...';
            const res  = await fetch(`${API_URL}/similar_artists?q=${encodeURIComponent(artistId)}`);
            const data = await res.json();

            if (data.error) {
                resultsBox.innerHTML = `<p>${data.error}</p>`;
                return;
            }

            if (data.results.length === 0) {
                resultsBox.innerHTML = '<p>No similar artists found.</p>';
                return;
            }

            const warning = data.confident ? '' : `
                <div class="warning">
                    <strong>Low confidence:</strong> ${data.artist_name} has only
                    ${data.tag_count} tag${data.tag_count === 1 ? '' : 's'}, so there is not enough
                    signal to rank neighbours meaningfully. Expect many near-identical scores.
                </div>`;

            resultsBox.innerHTML =
                `<h3>Artists similar to "${data.artist_name}"</h3>` +
                `<p class="seed">Based on ${data.tag_count} distinct tags.</p>` +
                warning +
                data.results.map(r => `
                    <div class="result-card">
                        <div style="display: flex; justify-content: space-between;">
                            <span>
                                <span class="artist-link" onclick="pivotTo('${r.artist_id}', '${r.artist_name.replace(/'/g, "\\'")}')">${r.artist_name}</span>
                                <span class="seed">(${r.tag_count} tags)</span>
                            </span>
                            <span style="margin-left: 20px"><strong>Similarity:</strong> ${r.score}</span>
                        </div>
                        <div class="tag-list">
                            Shared: ${r.shared_tags.join(', ')}
                            &middot; <span class="artist-link" onclick="loadArtistTags('${r.artist_id}', 'tags_${r.artist_id}')">all tags</span>
                        </div>
                        <div id="tags_${r.artist_id}" class="tag-list"></div>
                    </div>
                `).join('');
        }
    </script>
</body>
</html>
